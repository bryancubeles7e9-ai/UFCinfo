<!doctype html><html><body><iframe src="index.html#eventos" style="width:390px;height:844px"></iframe><pre id="result">RUNNING</pre><script>
const frame=document.querySelector('iframe');frame.onload=()=>setTimeout(async()=>{try{const d=frame.contentDocument;const assert=(v,m)=>{if(!v)throw Error(m)};assert(d.querySelectorAll('#event-list .event-card').length===3,'three upcoming');assert(d.querySelector('#event-list h3').textContent==='UFC 333','next first');assert(d.querySelector('#featured-event h3').textContent==='UFC 333','featured upcoming');for(const [i,b] of [...d.querySelectorAll('#event-list [data-official-event]')].entries()){b.click();assert(d.querySelectorAll('#event-detail .bout').length===[5,5,3][i],'announced fights');assert(!d.querySelector('#event-detail [data-pick]'),'no unsupported picks');assert(!d.querySelector('#event-detail').textContent.includes('Ganador:'),'no future winner');d.querySelector('#event-dialog').close()}const images=[...d.querySelectorAll('#event-list .event-poster-image')];images.forEach(i=>i.loading='eager');await new Promise(r=>setTimeout(r,600));assert(images.every(i=>i.complete&&i.naturalWidth>0),'posters loaded');assert(images[0].src.includes('ufc-333.jpg'),'real 333 poster');assert(images[1].src.includes('ufc-334.jpg'),'real 334 poster');assert(images[2].src.includes('event-poster-pending.svg'),'335 pending');assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,'mobile overflow');d.querySelector('[data-event-filter="completed"]').click();assert(d.querySelectorAll('#event-list .event-card').length===9,'past history');d.querySelector('[data-event-filter="official"]').click();assert(d.querySelectorAll('#event-list .event-card').length===12,'all official');const input=d.querySelector('#event-search');input.value='Evloev';input.dispatchEvent(new Event('input'));assert(d.querySelectorAll('#event-list .event-card').length===1,'upcoming fighter search');input.value='';input.dispatchEvent(new Event('input'));d.querySelector('[data-event-filter="upcoming"]').click();images[0].dispatchEvent(new Event('error'));document.querySelector('#result').textContent='PASS: 3 upcoming, 13 announced bouts, 9 past, 12 official, posters loaded, mobile, search';}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}},600);
</script></body></html>
