<!doctype html><html lang="en"><meta charset="utf-8"><title>Language checks</title><pre id="results">RUNNING</pre><iframe id="app" src="../index.html#guardados" width="390" height="844"></iframe><script type="module">
const frame = document.querySelector('#app');
const checks = [];
const check = (name, value) => { checks.push({name,pass:!!value}); if (!value) throw new Error(name); };
const pause = () => new Promise(resolve => setTimeout(resolve, 100));
try {
  await new Promise(resolve => frame.addEventListener('load',resolve,{once:true}));
  await pause();
  let doc = frame.contentDocument;
  const choose = async lang => { const select = frame.contentDocument.querySelector('#language-select'); select.value=lang; select.dispatchEvent(new Event('change',{bubbles:true})); await pause(); };
  await choose('es');
  check('Spanish navigation', doc.querySelector('[data-nav="guardados"]').textContent.includes('Mi esquina'));
  doc.querySelector('#fighter-search').value = 'Mi esquina custom event';
  await choose('en');
  check('English document language',doc.documentElement.lang==='en');
  check('English navigation',doc.querySelector('[data-nav="guardados"]').textContent.includes('My corner'));
  check('English account copy',doc.querySelector('#account-panel-title').textContent==='Save your corner to an account');
  check('English empty state',doc.querySelector('#following-upcoming').textContent.includes('Follow your favorite fighters'));
  check('English placeholder',doc.querySelector('#fighter-search').placeholder.includes('Name, nickname'));
  check('English comparison',doc.querySelector('#comparison-tables').textContent.includes('Striking accuracy'));
  check('User input unchanged',doc.querySelector('#fighter-search').value==='Mi esquina custom event');
  check('Spoilers stay enabled',doc.querySelector('#spoiler-button').getAttribute('aria-pressed')==='true');
  check('Language saved',frame.contentWindow.localStorage.getItem('ufcinfo-language')==='en');
  doc.querySelector('[data-profile="topuria"]').click();
  await pause();
  check('Dynamic profile English',doc.querySelector('#fighter-detail').textContent.includes('Height / reach'));
  await choose('ca');
  check('Catalan document language',doc.documentElement.lang==='ca');
  check('Catalan navigation',doc.querySelector('[data-nav="guardados"]').textContent.includes('El meu racó'));
  check('Catalan dynamic profile',doc.querySelector('#fighter-detail').textContent.includes('Alçada / abast'));
  check('Catalan user input unchanged',doc.querySelector('#fighter-search').value==='Mi esquina custom event');
  const catalanLoaded = new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  frame.contentWindow.location.reload(); await catalanLoaded; await pause();
  doc=frame.contentDocument;
  check('Catalan survives reload',doc.documentElement.lang==='ca' && doc.querySelector('#language-select').value==='ca');
  doc.querySelector('[data-profile="topuria"]').click();await pause();
  await choose('es');
  check('Open profile preserved',doc.querySelector('#fighter-dialog').open);
  check('Spanish profile restored',doc.querySelector('#fighter-detail').textContent.includes('Altura / alcance'));
  check('Spanish labels restored',doc.querySelector('#following-upcoming').textContent.includes('Sigue a tus luchadores'));
  await choose('en');
  const loaded = new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  frame.contentWindow.location.reload(); await loaded; await pause();
  doc=frame.contentDocument;
  check('English survives reload',doc.documentElement.lang==='en' && doc.querySelector('[data-nav="guardados"]').textContent.includes('My corner'));
  doc.querySelector('[data-nav="rumores"]').click();
  await pause();
  check('Rumors navigation', !doc.querySelector('[data-view="rumores"]').hidden);
  check('Spanish and English journalists',doc.querySelector('#rumor-sources').textContent.includes('Carlos Contreras Legaspi') && doc.querySelector('#rumor-sources').textContent.includes('Damon Martin'));
  const originalFetch=frame.contentWindow.fetch.bind(frame.contentWindow);
  const testFeed=await (await originalFetch('/assets/data/ufc-rumors.json')).json();
  const testRumor={id:'2000000000000000000',sourceId:'cclegaspi',postUrl:'https://x.com/CCLegaspi/status/2000000000000000000',publishedAt:'2026-10-01T12:00:00Z',reviewedAt:'2026-10-06T12:00:00Z',language:'es',fighters:['topuria','holloway'],summary:{es:'Resumen sintético de prueba',en:'Synthetic browser test report'},containsSpoilers:true,eventId:'ufc-335',official:null};
  testFeed.rumors=[testRumor];
  frame.contentWindow.fetch=(input,options)=>String(input).includes('/assets/data/ufc-rumors.json') ? Promise.resolve(new frame.contentWindow.Response(JSON.stringify(testFeed),{headers:{'Content-Type':'application/json'}})) : originalFetch(input,options);
  frame.contentWindow.dispatchEvent(new Event('hashchange'));await pause();
  check('Rumor source and post link',doc.querySelector('#rumor-list').textContent.includes('Carlos Contreras Legaspi') && doc.querySelector('#rumor-list a[href="'+testRumor.postUrl+'"]'));
  check('Rumor starts unconfirmed',doc.querySelector('#rumor-list').textContent.includes('UNCONFIRMED'));
  check('Rumor summary hidden by default',!doc.querySelector('#rumor-list').textContent.includes('Synthetic browser test report'));
  doc.querySelector('#rumor-list [data-reveal-result]').click();await pause();
  check('Rumor summary revealed',doc.querySelector('#rumor-list').textContent.includes('Synthetic browser test report'));
  testRumor.official={eventId:'ufc-335',url:'https://www.ufc.com/event/ufc-335',checkedAt:'2026-10-06T12:00:00Z',eventDate:'2026-12-13T02:00:00Z'};
  frame.contentWindow.dispatchEvent(new Event('hashchange'));await pause();
  check('Rumor updates to official confirmation',doc.querySelector('#rumor-list').textContent.includes('CONFIRMED BY UFC') && doc.querySelector('#rumor-list a[href="'+testRumor.official.url+'"]'));
  check('Original journalist retained after confirmation',doc.querySelector('#rumor-list').textContent.includes('Carlos Contreras Legaspi'));
  doc.querySelector('#rumor-source').value='mike-heck';doc.querySelector('#rumor-source').dispatchEvent(new Event('change'));await pause();
  check('Journalist filter',!doc.querySelector('#rumor-list a[href="'+testRumor.postUrl+'"]'));
  // Restore the manual browser’s default after the test.
  await choose('es');
  document.querySelector('#results').textContent=JSON.stringify({pass:true,checks},null,2);
} catch(error) {document.querySelector('#results').textContent=JSON.stringify({pass:false,error:error.message,checks},null,2);}
</script></html>
