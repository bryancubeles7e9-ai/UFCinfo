<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>UFCinfo · Actualizando</title>
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<style>
  /* Self-contained: shown by the service worker while the server restarts. */
  :root { --bg:#101010; --surface:#191919; --ink:#f3f1ec; --muted:#a9a6a0; --line:#2b2b2b; --accent:#f4512b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f2ed; --surface:#fff; --ink:#151515; --muted:#5f5c57; --line:#dedad2; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
         font:16px/1.55 "DM Sans", Arial, sans-serif; }
  main { width:min(460px,100%); text-align:center; padding:36px 28px; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
  .brand { font:800 26px/1 "Barlow Condensed", "Arial Narrow", Impact, sans-serif; letter-spacing:.02em; }
  .brand span { color:var(--accent); }
  .ring { width:54px; height:54px; margin:28px auto 22px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--accent);
          animation:spin 1s linear infinite; }
  h1 { font:800 30px/1.1 "Barlow Condensed", "Arial Narrow", Impact, sans-serif; margin:0 0 10px; text-transform:uppercase; }
  p { margin:0 0 10px; color:var(--muted); }
  .status { font-size:13px; margin-top:18px; }
  button { margin-top:14px; padding:12px 22px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:700 15px "DM Sans", Arial, sans-serif; cursor:pointer; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation:none; } }
</style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="brand">UFC<span>info</span></div>
  <div class="ring" aria-hidden="true"></div>
  <h1 id="title">Estamos actualizando la web</h1>
  <p id="body">UFCinfo se está actualizando con los últimos datos. Volverá a estar disponible en unos segundos.</p>
  <p id="safe">Tus luchadores seguidos y tus pronósticos están a salvo.</p>
  <p class="status" id="status">Comprobando…</p>
  <button type="button" id="retry">Reintentar ahora</button>
</main>
<script>
  const texts = {
    es: {title:'Estamos actualizando la web', body:'UFCinfo se está actualizando con los últimos datos. Volverá a estar disponible en unos segundos.',
         safe:'Tus luchadores seguidos y tus pronósticos están a salvo.', retry:'Reintentar ahora', wait:s=>`Nuevo intento en ${s} s…`, checking:'Comprobando…'},
    en: {title:'We are updating the site', body:'UFCinfo is updating with the latest data. It will be back in a few seconds.',
         safe:'Your followed fighters and your picks are safe.', retry:'Try again now', wait:s=>`Retrying in ${s} s…`, checking:'Checking…'},
    ca: {title:'Estem actualitzant el web', body:'UFCinfo s’està actualitzant amb les últimes dades. Tornarà a estar disponible en uns segons.',
         safe:'Els teus lluitadors seguits i els teus pronòstics estan a salvo.', retry:'Torna-ho a provar', wait:s=>`Nou intent d’aquí a ${s} s…`, checking:'Comprovant…'},
  };
  let saved = null;
  try { saved = localStorage.getItem('ufcinfo-language'); } catch {}
  const code = [saved, ...(navigator.languages || [navigator.language])].map(l => String(l || '').slice(0, 2)).find(l => texts[l]) || 'es';
  const t = texts[code];
  document.documentElement.lang = code;
  for (const id of ['title', 'body', 'safe']) document.getElementById(id).textContent = t[id];
  document.getElementById('retry').textContent = t.retry;
  const status = document.getElementById('status');
  let seconds = 5, timer;
  async function check() {
    clearTimeout(timer);
    status.textContent = t.checking;
    try {
      const response = await fetch('/api/health', {cache: 'no-store'});
      if (response.ok) return location.reload();
    } catch {}
    tick(seconds = Math.min(seconds + 2, 15));
  }
  function tick(left) {
    status.textContent = t.wait(left);
    timer = left > 1 ? setTimeout(() => tick(left - 1), 1000) : setTimeout(check, 1000);
  }
  document.getElementById('retry').addEventListener('click', check);
  tick(seconds);
</script>
</body>
</html>
