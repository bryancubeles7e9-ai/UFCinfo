name: Comprobar confirmaciones de rumores
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'assets/data/ufc-rumors.json'
      - 'scripts/sync-rumor-confirmations.py'
permissions:
  contents: read
concurrency:
  group: ufcinfo-rumor-confirmations
  cancel-in-progress: false
jobs:
  verify:
    # Explicit opt-in: no scheduled runner or network use before configuration.
    if: vars.UFCINFO_RUMORS_AUTO_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar confirmaciones oficiales
        run: python3 scripts/sync-rumor-confirmations.py
      - name: Guardar confirmaciones
        if: always()
        run: |
          git add assets/data/ufc-rumors.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar confirmaciones oficiales de rumores'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
