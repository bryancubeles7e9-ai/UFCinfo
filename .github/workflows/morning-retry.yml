name: Reintentar datos pendientes a las 10
on:
  # Completed rumor runs are extra opportunities, regardless of their result.
  workflow_run:
    workflows: [Publicar rumores automaticamente]
    types: [completed]
    branches: [main]
  schedule:
    # Multiple opportunities if GitHub delays a run; the script deduplicates by Madrid date.
    - cron: '7 10-13 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octagon-ufc-sync
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Comprobar hora de Madrid
        id: clock
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              hour = datetime.now(ZoneInfo('Europe/Madrid')).hour
              due = 10 <= hour < 14
              print('Reintento disponible.' if due else 'Fuera de 10:00–14:00 (Madrid); no se consultan fuentes.')
              f.write(f'due={str(due).lower()}\n')
          PY
      - uses: actions/checkout@v6
        if: steps.clock.outputs.due == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v6
        if: steps.clock.outputs.due == 'true'
        with:
          node-version: '22'
      - name: Reintentar únicamente datos pendientes
        if: steps.clock.outputs.due == 'true'
        run: python3 scripts/retry-morning-data.py
      - name: Guardar resultados y control de duplicados
        if: steps.clock.outputs.due == 'true'
        run: |
          if [ ! -f assets/data/morning-retry.json ]; then exit 0; fi
          # Titles and photos of the shareable /luchadores and /carteleras addresses follow the data.
          node scripts/build-share-index.mjs || echo "::warning::No se pudo actualizar el índice de enlaces para compartir."
          # Every completed result joins the permanent fight history (recent form keeps earlier seasons).
          node scripts/build-fight-history.mjs || echo "::warning::No se pudo actualizar el historial de combates."
          git add assets/data/morning-retry.json assets/data/ufc-events.json assets/data/fighter-records.json assets/js/fighter-directory-data.js docs/fighter-directory-sources.json assets/data/share-index.json assets/data/fight-history.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Reintentar datos pendientes de la velada a las 10'
            # A concurrent data push must not repeat any UFC consultations.
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -lt 3 ]; then sleep "$attempt"; fi
            done
            exit 1
          fi
