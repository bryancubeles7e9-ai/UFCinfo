name: Publicar rumores automaticamente
on:
  workflow_dispatch:
    inputs:
      broad_search:
        description: 'Buscar los ultimos 7 dias (hasta 10 consultas, 3000 creditos reservados)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/rumor-sync.yml'
      - 'scripts/sync-rumors.mjs'
      - 'scripts/rumor-fighter-names.mjs'
      - 'scripts/rumor-auto-feed.mjs'
      - 'tests/test-rumor-filter.mjs'
      - 'tests/test-rumor-calendar.mjs'
      - 'tests/test-rumor-search-time.mjs'
  schedule:
    # Backup opportunities; the script skips an already searched hour.
    - cron: '17,37,57 * * * *'
permissions:
  contents: write
concurrency:
  group: ufcinfo-rumor-automation
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar filtros y confirmaciones sin consultar APIs
        run: |
          node tests/test-rumor-auto-sync.mjs
          node tests/test-rumor-filter.mjs
          node tests/test-rumor-calendar.mjs
          node tests/test-rumor-search-time.mjs
          node tests/test-rumor-candidate-groups.mjs
          python3 tests/test_rumor_confirmations.py
      - name: Comprobar credenciales de búsqueda
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          if [ -z "$TWITTERAPI_IO_KEY" ]; then
            echo 'Falta el secreto TWITTERAPI_IO_KEY. No se ha consultado la API.'
            exit 1
          fi
      - name: Recopilar, filtrar y publicar rumores
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          UFCINFO_RUMOR_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.broad_search && 'true' || 'false' }}
        run: node scripts/sync-rumors.mjs
      - name: Retirar peleas confirmadas en UFC.com
        run: python3 scripts/sync-rumor-confirmations.py
      - name: Guardar el catalogo publico
        run: |
          git add assets/data/ufc-rumor-groups.json assets/data/ufc-rumors.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar rumores UFC automaticamente'
            # Other data workflows can advance main between pull and push.
            # Retry only publication; never repeat the paid rumor search.
            published=false
            for attempt in 1 2 3 4 5; do
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                echo "::error::No se pudo integrar main; se conserva el fallo para revisión."
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
            done
            if [ "$published" != true ]; then
              echo "::error::No se pudo publicar rumores tras cinco intentos."
              exit 1
            fi
          fi
      # Render auto-deploys main on commit; avoid a second deploy via hook.
