name: Actualizar récords de luchadores
on:
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-fighter-records.py
      - .github/workflows/fighter-records.yml
permissions:
  contents: read
concurrency:
  group: octagon-ufc-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar conexión y formato real
        if: github.event_name != 'schedule'
        env:
          API_SPORTS_MMA_KEY: ${{ secrets.API_SPORTS_MMA_KEY }}
        run: python3 scripts/sync-fighter-records.py --probe
      - name: Actualizar solo luchadores de eventos terminados
        env:
          API_SPORTS_MMA_KEY: ${{ secrets.API_SPORTS_MMA_KEY }}
        run: python3 scripts/sync-fighter-records.py
      - name: Guardar fichas verificadas
        run: |
          git add assets/data/fighter-records.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar récords MMA de luchadores UFC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
