name: Actualizar récords de luchadores
on:
  # Regular updates now run inside ufc-events.yml. Old empty cron dispatches
  # intentionally skip this job to avoid a separate third daily refresh.
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Consultar todos los luchadores (actualización global manual)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: octagon-ufc-sync
  cancel-in-progress: false
jobs:
  sync:
    if: inputs.full_refresh == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test conservación y actualización de récords
        run: python3 -m unittest discover -s tests -p 'test_ufc_fighter_records.py'
      - name: Test carga dinámica de estadísticas
        run: node tests/test-fighter-records-feed.mjs
      - name: Comprobar cobertura de la cartelera del 10 de octubre
        run: node tests/test-october-10-card.mjs
      - name: Comprobar etiquetas de países
        run: |
          node tests/test-fighter-country.mjs
          python3 tests/test_fighter_countries.py
      - name: Comprobar guardias y fuentes
        run: |
          node tests/test-fighter-stances.mjs
          python3 tests/test_fighter_stances.py
      - name: Actualizar todos los récords y estadísticas
        run: python3 scripts/sync-ufc-fighter-records.py --all
      - name: Guardar fichas verificadas
        run: |
          git add assets/data/fighter-records.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar récords oficiales de luchadores UFC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
