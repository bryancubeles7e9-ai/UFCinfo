name: Actualizar récords de luchadores
on:
  # cron-job.org dispatches daily at 11:47 Europe/Madrid.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-ufc-fighter-records.py
      - .github/workflows/fighter-records.yml
permissions:
  contents: read
concurrency:
  group: octagon-ufc-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test conservación y actualización de récords
        run: python3 -m unittest discover -s tests -p 'test_ufc_fighter_records.py'
      - name: Test carga dinámica de estadísticas
        run: node tests/test-fighter-records-feed.mjs
      - name: Comprobar cobertura de la cartelera del 10 de octubre
        run: node tests/test-october-10-card.mjs
      - name: Comprobar perfiles reales de UFC
        if: github.event_name != 'schedule'
        run: python3 scripts/sync-ufc-fighter-records.py --probe
      - name: Actualizar solo luchadores de eventos terminados
        run: python3 scripts/sync-ufc-fighter-records.py
      - name: Guardar fichas verificadas
        run: |
          git add assets/data/fighter-records.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar récords oficiales de luchadores UFC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
