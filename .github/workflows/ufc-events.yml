name: Actualizar eventos UFC
on:
  # cron-job.org dispatches at 08:00 and 14:00 Europe/Madrid.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/sync-ufc-events.py'
      - 'scripts/sync-cito-events.py'
      - 'scripts/run-data-sync.py'
      - 'scripts/reconcile-official-results.py'
      - 'scripts/import-season-fighters.py'
      - 'scripts/sync-ufc-rankings.py'
      - 'scripts/sync-ufc-fighter-records.py'
      - 'scripts/sync-fighter-photos.py'
      - 'tests/test_ufc_fighter_records.py'
      - 'tests/test-rankings-feed.mjs'
      - 'tests/test-events-feed.mjs'
      - 'tests/test_ufc_sync.py'
      - 'tests/test_cito_sync.py'
      - 'tests/test_rankings_sync.py'
      - '.github/workflows/ufc-events.yml'
permissions:
  contents: read
concurrency:
  group: octagon-ufc-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test importador
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test carga dinámica
        run: |
          node tests/test-events-feed.mjs
          node tests/test-event-visibility.mjs
          node tests/test-data-health.mjs
      - name: Test rankings dinámicos
        run: node tests/test-rankings-feed.mjs
      - name: Test récords y estadísticas dinámicos
        run: node tests/test-fighter-records-feed.mjs
      - name: Actualizar rankings oficiales
        continue-on-error: true
        run: python3 scripts/run-data-sync.py rankings
      - name: Guardar rankings actualizados
        run: |
          git add assets/data/ufc-rankings.json assets/data/sync-health.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar rankings oficiales UFC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Comprobar clave
        id: key
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          if [ -n "$CITO_API_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Configura CITO_API_KEY en los secretos del repositorio para activar Cito. Se conserva la copia actual.'
          fi
      - name: Consultar Cito
        continue-on-error: true
        if: steps.key.outputs.configured == 'true'
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python3 scripts/run-data-sync.py events
      - name: Verificar resultados recientes con UFC
        run: python3 scripts/run-data-sync.py results
      - name: Guardar datos actualizados
        run: |
          git add assets/data/ufc-events.json assets/data/sync-health.json
          if [ -d assets/images/events ]; then git add assets/images/events; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar carteleras y resultados UFC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Incorporar perfiles de próximas carteleras
        continue-on-error: true
        run: python3 scripts/import-season-fighters.py --upcoming
      - name: Incorporar participantes nuevos verificados
        continue-on-error: true
        run: python3 scripts/import-season-fighters.py --recent
      - name: Guardar participantes verificados
        run: |
          git add assets/js/fighter-directory-data.js docs/fighter-directory-sources.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Incorporar participantes recientes y próximos de UFC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Test selección de fotografías
        run: node tests/test-fighter-photos.mjs
      - name: Actualizar fotografías de campeones y excampeones
        continue-on-error: true
        run: python3 scripts/run-data-sync.py photos
      - name: Guardar fotografías consultadas
        run: |
          git add assets/data/fighter-photos.json assets/data/sync-health.json
          if [ -d assets/images/fighter-variants ]; then git add assets/images/fighter-variants; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar fotografías de campeones y excampeones'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Actualizar récords y estadísticas tras las carteleras
        run: python3 scripts/run-data-sync.py records --ensure-full
      - name: Guardar perfiles consultados
        run: |
          git add assets/data/fighter-records.json assets/data/sync-health.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Actualizar récords y estadísticas tras las carteleras UFC'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Guardar estado incluso tras un fallo
        if: always()
        run: |
          git add assets/data/sync-health.json assets/data/ufc-events.json assets/data/ufc-rankings.json assets/data/fighter-records.json assets/data/fighter-photos.json assets/js/fighter-directory-data.js docs/fighter-directory-sources.json
          if [ -d assets/images/events ]; then git add assets/images/events; fi
          if [ -d assets/images/fighter-variants ]; then git add assets/images/fighter-variants; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Registrar estado de las sincronizaciones'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Identificar versión
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  publish:
    # Opt in only after GitHub Pages is configured. API synchronization works without Pages.
    if: vars.OCTAGON_PAGES_ENABLED == 'true'
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.revision }}
      - uses: actions/configure-pages@v5
      - name: Preparar web
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
