name: Actualizar eventos UFC
on:
  schedule:
    - cron: '0 8,14 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/sync-ufc-events.py'
      - 'scripts/sync-cito-events.py'
      - 'scripts/sync-event-schedules.py'
      - 'scripts/run-data-sync.py'
      - 'scripts/reconcile-official-results.py'
      - 'scripts/import-season-fighters.py'
      - 'scripts/sync-ufc-rankings.py'
      - 'scripts/sync-ufc-fighter-records.py'
      - 'scripts/sync-fighter-photos.py'
      - 'tests/test_ufc_fighter_records.py'
      - 'tests/test-rankings-feed.mjs'
      - 'tests/test-events-feed.mjs'
      - 'tests/test_ufc_sync.py'
      - 'tests/test_cito_sync.py'
      - 'tests/test_event_schedules.py'
      - 'tests/test_rankings_sync.py'
      - '.github/workflows/ufc-events.yml'
permissions:
  contents: read
concurrency:
  group: octagon-ufc-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test importador
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test carga dinámica
        run: |
          node tests/test-events-feed.mjs
          node tests/test-event-visibility.mjs
          node tests/test-data-health.mjs
      - name: Test rankings dinámicos
        run: node tests/test-rankings-feed.mjs
      - name: Test récords y estadísticas dinámicos
        id: preflight
        run: node tests/test-fighter-records-feed.mjs
      - name: Actualizar eventos, combates y horarios desde UFC
        id: official_cards
        continue-on-error: true
        run: python3 scripts/run-data-sync.py events
      - name: Verificar resultados recientes con UFC
        id: results
        continue-on-error: true
        run: python3 scripts/run-data-sync.py results
      - name: Actualizar rankings oficiales
        id: rankings
        continue-on-error: true
        run: python3 scripts/run-data-sync.py rankings
      - name: Incorporar perfiles de próximas carteleras
        id: upcoming_profiles
        continue-on-error: true
        run: python3 scripts/import-season-fighters.py --upcoming
      - name: Incorporar participantes nuevos verificados
        id: recent_profiles
        continue-on-error: true
        run: python3 scripts/import-season-fighters.py --recent
      - name: Incorporar luchadores clasificados sin perfil
        id: ranked_profiles
        continue-on-error: true
        run: python3 scripts/import-season-fighters.py --rankings
      - name: Test selección de fotografías
        id: photo_check
        continue-on-error: true
        run: node tests/test-fighter-photos.mjs
      - name: Actualizar fotografías de campeones y excampeones
        id: photos
        if: steps.photo_check.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/run-data-sync.py photos
      - name: Actualizar récords y estadísticas tras las carteleras
        id: records
        continue-on-error: true
        run: python3 scripts/run-data-sync.py records --ensure-full
      - name: Crear copias ligeras de las fotos nuevas
        # Optional: if it fails, the server keeps sending the original photos.
        continue-on-error: true
        run: |
          python3 -m pip install --quiet pillow==12.0.0
          python3 scripts/optimize-images.py
      - name: Publicar todos los datos en un commit
        id: revision
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: |
          git add assets/data/sync-health.json assets/data/ufc-events.json assets/data/ufc-rankings.json assets/data/fighter-records.json assets/data/fighter-photos.json assets/js/fighter-directory-data.js docs/fighter-directory-sources.json
          if [ -d assets/images/events ]; then git add assets/images/events; fi
          if [ -d assets/images/fighter-variants ]; then git add assets/images/fighter-variants; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publicar datos actualizados de UFCinfo'
            # Retry only publication; never rerun the source requests.
            published=false
            for attempt in 1 2 3 4 5; do
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                echo "::error::No se pudo integrar main; requiere revisión."
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
            done
            if [ "$published" != true ]; then
              echo "::error::No se pudieron publicar los datos tras cinco intentos."
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Señalar fallos de sincronización tras publicar los datos disponibles
        if: steps.revision.outcome == 'success'
        env:
          CARTELERAS: ${{ steps.official_cards.outcome }}
          RESULTADOS: ${{ steps.results.outcome }}
          RANKINGS: ${{ steps.rankings.outcome }}
          PERFILES_PROXIMOS: ${{ steps.upcoming_profiles.outcome }}
          PERFILES_RECIENTES: ${{ steps.recent_profiles.outcome }}
          PERFILES_CLASIFICADOS: ${{ steps.ranked_profiles.outcome }}
          VALIDACION_FOTOGRAFIAS: ${{ steps.photo_check.outcome }}
          FOTOGRAFIAS: ${{ steps.photos.outcome }}
          RECORDS: ${{ steps.records.outcome }}
        run: |
          failed=0
          for stage in CARTELERAS RESULTADOS RANKINGS PERFILES_PROXIMOS PERFILES_RECIENTES PERFILES_CLASIFICADOS VALIDACION_FOTOGRAFIAS FOTOGRAFIAS RECORDS; do
            if [ "${!stage}" = failure ]; then
              echo "::error::Falló ${stage}; consulta su paso para más detalles."
              failed=1
            fi
          done
          exit "$failed"
  publish:
    # Opt in only after GitHub Pages is configured. API synchronization works without Pages.
    if: vars.OCTAGON_PAGES_ENABLED == 'true'
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.revision }}
      - uses: actions/configure-pages@v5
      - name: Preparar web
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

