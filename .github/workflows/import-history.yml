name: Importar historial de una temporada
# Run by hand: adds a past season's official UFC results to the permanent fight history
# (assets/data/fight-history.json), which feeds each fighter's recent form.
on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Temporada que importar'
        required: true
        default: '2025'
      publish:
        description: 'Publicar el resultado (si no, solo muestra lo que encontraría)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: octagon-ufc-sync
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test importador
        run: python3 -m unittest tests.test_history_year
      - name: Leer la temporada en UFC.com
        env:
          YEAR: ${{ inputs.year }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if ! [[ "$YEAR" =~ ^20[0-9]{2}$ ]]; then echo "::error::Año no válido"; exit 1; fi
          if [ "$PUBLISH" = "true" ]; then python3 scripts/import-history-year.py "$YEAR"; else python3 scripts/import-history-year.py "$YEAR" --dry-run; fi
      - name: Copias ligeras de los pósteres
        if: ${{ inputs.publish }}
        run: |
          python3 -m pip install --quiet pillow==12.0.0
          python3 scripts/optimize-images.py
      - name: Comprobar el historial y el archivo
        run: |
          node scripts/build-fight-history.mjs
          node scripts/build-fight-history.mjs --check
          node scripts/build-share-index.mjs
          node tests/test-recent-form.mjs
          node tests/test-event-archive.mjs
      - name: Publicar
        id: publish
        if: ${{ inputs.publish }}
        env:
          YEAR: ${{ inputs.year }}
        run: |
          git add assets/data/fight-history.json assets/data/ufc-events-archive.json assets/data/share-index.json
          if [ -d assets/images/events ]; then git add assets/images/events; fi
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Añadir la temporada $YEAR: resultados al historial y carteleras al archivo"
          for attempt in 1 2 3 4 5; do
            if ! git pull --rebase origin main; then git rebase --abort || true; echo "::error::No se pudo integrar main"; exit 1; fi
            if git push origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $((attempt * 2))
          done
          echo "::error::No se pudo publicar tras cinco intentos"; exit 1
      # Commits pushed by this job do not always start a Render deploy on their own: ask for one.
      - name: Actualizar Render
        if: steps.publish.outputs.changed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --output /dev/null --request POST "$RENDER_DEPLOY_HOOK_URL"
          fi
